<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Demon List</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #161923;
            --card-hover: #1e2230;
            --modal-bg: #12141d;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --rank-red: #ef4444;
            --input-bg: #131722;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(220, 38, 38, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(79, 70, 229, 0.08) 0%, transparent 40%);
        }

        /* 상단 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 13, 18, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .logo-box {
            background-color: #4f46e5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
        }

        /* 메인 영역 */
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--rank-red);
            margin-bottom: 2rem;
            font-weight: 800;
        }

        /* 검색바 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .menu-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        /* 리스트 카드 스타일 */
        .list-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .level-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 20px;
            transition: transform 0.15s, background-color 0.15s;
            cursor: pointer;
        }

        .level-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .rank-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--rank-red);
            width: 60px;
            text-align: center;
            flex-shrink: 0;
        }

        .rank-number span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-sub);
            font-weight: normal;
        }

        .thumb {
            width: 140px;
            height: 75px;
            border-radius: 8px;
            object-fit: cover;
            margin: 0 20px 0 10px;
            background-color: #2a2e3d;
            flex-shrink: 0;
        }

        .level-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .level-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .level-author {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* ===================================================
           상세 모달 (팝업창) 레이아웃
        =================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--text-sub);
            cursor: pointer;
            border: none;
            background: none;
        }

        .modal-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        /* 비디오 임베드 컨테이너 */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 비율 */
            height: 0;
            margin-bottom: 1.2rem;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 레벨 서버 설명 */
        .level-description {
            text-align: center;
            font-style: italic;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
        }

        /* 상세 정보 그리드 레이아웃 */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 20px;
            font-size: 0.88rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.2rem;
        }

        .detail-item {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .detail-item.full-width {
            grid-column: span 2;
        }

        .detail-label {
            font-weight: 700;
            color: var(--text-main);
        }

        .detail-value {
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-box">✓ ALL</span> DEMON LIST
        </div>
        <div class="nav-buttons">
            <a href="#" class="btn-sm">Discord</a>
            <a href="index.html" class="btn-sm">Main Page</a>
        </div>
    </header>

    <div class="container">
        <h1 class="title">All Demon List</h1>

        <div class="search-box">
            <button class="menu-btn">☰</button>
            <input type="text" id="searchInput" class="search-input" placeholder="Search...">
        </div>

        <div class="list-group" id="listGroup"></div>
    </div>

    <!-- 상세 정보 모달 (팝업창) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="close-btn" id="closeModal">&times;</button>
            
            <h2 class="modal-title" id="mTitle">Society</h2>
            
            <!-- 유튜브 영상 -->
            <div class="video-container">
                <iframe id="mVideo" src="" allowfullscreen></iframe>
            </div>

            <!-- 서버 내 설명 -->
            <p class="level-description" id="mDesc">// Is it guilt that keeps you awake at night... // </p>

            <!-- 상세 Spec 구역 -->
            <div class="detail-grid">
                <div class="detail-item"><span class="detail-label">Creator</span> <span class="detail-value" id="mCreator"></span></div>
                <div class="detail-item"><span class="detail-label">Verifier</span> <span class="detail-value" id="mVerifier"></span></div>
                
                <div class="detail-item"><span class="detail-label">ID</span> <span class="detail-value" id="mId"></span></div>
                <div class="detail-item"><span class="detail-label">Password</span> <span class="detail-value" id="mPass"></span></div>
                
                <div class="detail-item"><span class="detail-label">Length</span> <span class="detail-value" id="mLength"></span></div>
                <div class="detail-item"><span class="detail-label">Object Count</span> <span class="detail-value" id="mObjects"></span></div>
                
                <div class="detail-item full-width"><span class="detail-label">Upload Version</span> <span class="detail-value" id="mVersion"></span></div>
                
                <div class="detail-item"><span class="detail-label">Difficulty</span> <span class="detail-value" id="mDifficulty"></span></div>
                <div class="detail-item"><span class="detail-label">Rating</span> <span class="detail-value" id="mRating"></span></div>
                
                <div class="detail-item full-width"><span class="detail-label">Song</span> <span class="detail-value" id="mSong"></span></div>
            </div>
        </div>
    </div>

    <script>
        // ===================================================
        // 레벨 데이터 설정 (원하시는 내용으로 자유롭게 수정 가능)
        // ===================================================
        const levels = [
            {
                name: "Society",
                author: "Neomarbilan and more",
                verifier: "wPopoff",
                thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg",
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", // 퍼가기용 embed 링크
                desc: "// Is it guilt that keeps you awake at night or is it someone who cant accept the truth? //",
                id: "127323087",
                password: "Free Copy",
                length: "2m 23s",
                objectCount: "168,386",
                uploadVersion: "2.208",
                difficulty: "Extreme Demon",
                rating: "Featured",
                song: "Pathetic - Society (Remix) by HelliXScream (ID 1569886), Society by pathetic240px (NONG)"
            },
            {
                name: "Thinking Space II",
                author: "CairoX",
                verifier: "CairoX",
                thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg",
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                desc: "The sequel to Thinking Space.",
                id: "98765432",
                password: "No Copy",
                length: "1m 55s",
                objectCount: "120,400",
                uploadVersion: "2.1",
                difficulty: "Extreme Demon",
                rating: "Epic",
                song: "NONG Track - Thinking Space II Mix"
            }
        ];

        // 리스트 UI 렌더링
        function renderList(data) {
            const container = document.getElementById('listGroup');
            container.innerHTML = '';

            data.forEach((item, index) => {
                const rank = index + 1;
                const cardHtml = `
                    <div class="level-card" onclick="openModal(${index})">
                        <div class="rank-number">
                            #${rank}
                            <span>#${rank}</span>
                        </div>
                        <img class="thumb" src="${item.thumb}" alt="${item.name}">
                        <div class="level-info">
                            <div class="level-title">${item.name}</div>
                            <div class="level-author">by ${item.author}</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // 모달 열기 함수 (데이터 주입)
        function openModal(index) {
            const level = levels[index];
            document.getElementById('mTitle').innerText = level.name;
            document.getElementById('mVideo').src = level.videoUrl;
            document.getElementById('mDesc').innerText = level.desc;
            document.getElementById('mCreator').innerText = level.author;
            document.getElementById('mVerifier').innerText = level.verifier;
            document.getElementById('mId').innerText = level.id;
            document.getElementById('mPass').innerText = level.password;
            document.getElementById('mLength').innerText = level.length;
            document.getElementById('mObjects').innerText = level.objectCount;
            document.getElementById('mVersion').innerText = level.uploadVersion;
            document.getElementById('mDifficulty').innerText = level.difficulty;
            document.getElementById('mRating').innerText = level.rating;
            document.getElementById('mSong').innerText = level.song;

            document.getElementById('modalOverlay').classList.add('active');
        }

        // 모달 닫기
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('mVideo').src = ""; // 영상 소리 끔
        });

        // 배경 클릭 시 닫기
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
                document.getElementById('mVideo').src = "";
            }
        });

        // 검색 기능
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = levels.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.author.toLowerCase().includes(query)
            );
            renderList(filtered);
        });

        // 초기 실행
        renderList(levels);
    </script>
</body>
</html>
